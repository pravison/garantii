{% extends 'main.html' %}
{% block content%}
    <!-- Section -->
    <div class="row justify-content-center section-heading">
        <div class="col-lg-6 text-center">
            <p class="fs-6 m-0">you are accessing  wallet account.</p>
            <h3 class="h2 mt-2 mb-0" id="walletName">personal walet</h3>
        </div>
    </div>
    <section class="section">
        <div class="container">
            <div class="row gy-4">
                <!-- WALLET SUMMARY BOXES -->
                <div class="col-lg-4">
                    <div class="px-4 position-relative pt-5 text-center rounded  mb-2" style="background-color: #e6ffd6;">
                        <h6 style="color: #2e6b1c;">Total Balance</h6>
                        <h3 class="m-0 text-dark  p-2" id="walletBalance">Ksh 0</h3>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="px-4 position-relative pt-5 text-center rounded  mb-2" style="background-color: #ffe1db;">
                        <h6 style="color: #f62b22;">Received Locked Balance</h6>
                        <h3 class="m-0 text-dark  p-2" id="walletReceivedLocked">Ksh 0</h3>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="px-4 position-relative pt-5 text-center rounded  mb-2" style="background-color: #ffdee1;">
                        <h6 style="color: #fe0d25;">Send Locked Balance</h6>
                        <h3 class="m-0 text-dark p-2" id="walletSentLocked">Ksh 0</h3>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- End Section -->
{% endblock %}


<script>
/* =========================
   GLOBAL STATE (IMPORTANT)
========================= */
let currentWallet = null;   // active wallet object
let previewData = null;     // preview response from backend

/* =========================
   HELPERS
========================= */
function getToken() {
    return localStorage.getItem("access_token")?.trim();
}

function requireAuth() {
    const token = getToken();
    if (!token) {
        showLoginModal();
        return null;
    }
    return token;
}

function showModal(id) {
    new bootstrap.Modal(document.getElementById(id)).show();
}

function hideModal(id) {
    const modal = bootstrap.Modal.getInstance(document.getElementById(id));
    if (modal) modal.hide();
}

/* =========================
   OPEN WITHDRAWAL MODAL
========================= */
function openWithdrawal(wallet) {
    const token = requireAuth();
    if (!token) return;

    currentWallet = wallet;

    document.getElementById("withdrawableBalance").innerText =
        `KES ${parseFloat(wallet.withdrawable_balance).toFixed(2)}`;

    document.getElementById("withdrawAmount").value = "";
    showModal("withdrawalModal");
}

/* =========================
   PREVIEW WITHDRAWAL
========================= */
document.getElementById("withdrawalForm").addEventListener("submit", async e => {
    e.preventDefault();

    const token = requireAuth();
    if (!token) return;

    const amount = document.getElementById("withdrawAmount").value;

    try {
        const response = await fetch("/withdrawals/preview/", {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + token,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                wallet_id: currentWallet.id,
                amount: amount
            })
        });

        if (response.status === 401 || response.status === 403) {
            localStorage.removeItem("access_token");
            showLoginModal();
            return;
        }

        const data = await response.json();

        if (!response.ok) {
            alert(data.detail || "Unable to preview withdrawal");
            return;
        }

        previewData = data;

        document.getElementById("confirmAmount").innerText = `KES ${data.amount}`;
        document.getElementById("confirmFee").innerText = `KES ${data.fee}`;
        document.getElementById("confirmTotal").innerText = `KES ${data.total}`;
        document.getElementById("confirmPhone").innerText = data.phone;

        hideModal("withdrawalModal");
        showModal("confirmWithdrawalModal");

    } catch (err) {
        alert("Network error. Please try again.");
    }
});

/* =========================
   CONFIRM → PIN STEP
========================= */
document.getElementById("confirmWithdrawBtn").addEventListener("click", () => {
    hideModal("confirmWithdrawalModal");

    if (previewData.pin_required) {
        showModal("setPinModal");
    } else {
        showModal("pinModal");
    }
});

/* =========================
   SET PIN
========================= */
document.getElementById("setPinBtn").addEventListener("click", async () => {
    const token = requireAuth();
    if (!token) return;

    const pin = document.getElementById("newPin").value;
    const confirmPin = document.getElementById("confirmNewPin").value;

    if (!pin || pin.length < 4) {
        alert("PIN must be at least 4 digits");
        return;
    }

    if (pin !== confirmPin) {
        alert("PINs do not match");
        return;
    }

    try {
        const response = await fetch("/pins/set/", {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + token,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ pin })
        });

        if (!response.ok) {
            alert("Failed to set PIN");
            return;
        }

        hideModal("setPinModal");
        showModal("pinModal");

    } catch (err) {
        alert("Network error while setting PIN");
    }
});

/* =========================
   FINAL CONFIRM (SUBMIT PIN)
========================= */
document.getElementById("submitPinBtn").addEventListener("click", async () => {
    const token = requireAuth();
    if (!token) return;

    const pin = document.getElementById("userPin").value;

    if (!pin) {
        alert("Enter your PIN");
        return;
    }

    try {
        const response = await fetch("/withdrawals/confirm/", {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + token,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                wallet_id: currentWallet.id,
                amount: previewData.amount,
                pin: pin
            })
        });

        if (response.status === 401 || response.status === 403) {
            localStorage.removeItem("access_token");
            showLoginModal();
            return;
        }

        const data = await response.json();

        if (!response.ok) {
            alert(data.detail || "Withdrawal failed");
            return;
        }

        hideModal("pinModal");
        alert("Withdrawal processing. You will receive Mpesa message shortly.");

        // reset state
        currentWallet = null;
        previewData = null;

    } catch (err) {
        alert("Network error. Please try again.");
    }
});
</script>
